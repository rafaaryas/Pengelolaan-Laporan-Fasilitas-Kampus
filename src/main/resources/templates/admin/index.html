<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Ringkasan admin')}"></head>
<body th:replace="~{fragments/common :: admin('beranda', ~{::main})}">
<main id="main" tabindex="-1" class="a-isi">
  <header class="a-kepala">
    <div><h1>Ringkasan penanganan</h1><p>Angka di bawah dihitung langsung dari basis data saat halaman dibuka.</p></div>
    <a class="tombol tombol-utama" th:href="@{/admin/kasus}">Buka daftar kasus<svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
  </header>
  <section aria-labelledby="judul-angka">
    <h2 id="judul-angka" class="sr-only">Angka utama</h2>
    <dl class="a-angka">
      <div><dt>Total laporan</dt><dd><a th:href="@{/admin/kasus}" th:text="${ringkasan.totalLaporan}">0</a></dd></div>
      <div><dt>Kasus aktif</dt><dd><a th:href="@{/admin/kasus}" th:text="${ringkasan.kasusAktif}">0</a></dd></div>
      <div><dt>Menunggu verifikasi</dt><dd><a th:href="@{/admin/kasus(status='MENUNGGU_VERIFIKASI')}" th:text="${ringkasan.menungguVerifikasi}">0</a></dd></div>
      <div th:classappend="${ringkasan.kritis > 0} ? 'angka-waspada'"><dt>Kritis aktif</dt><dd><a th:href="@{/admin/kasus(prioritas='KRITIS')}" th:text="${ringkasan.kritis}">0</a></dd></div>
      <div><dt>Sedang diperbaiki</dt><dd><a th:href="@{/admin/kasus(status='DIKERJAKAN')}" th:text="${ringkasan.dikerjakan}">0</a></dd></div>
      <div><dt>Selesai</dt><dd><a th:href="@{/admin/kasus(status='SELESAI')}" th:text="${ringkasan.selesai}">0</a></dd></div>
    </dl>
  </section>
  <section class="a-bagian" aria-labelledby="judul-terbaru">
    <div class="bagian-kepala"><h2 id="judul-terbaru">Kasus dengan laporan terbaru</h2><a class="tautan" th:href="@{/admin/kasus}">Semua kasus menurut urgensi<svg aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    <th:block th:if="${ringkasan.terbaru.isEmpty()}"><div th:replace="~{fragments/common :: empty('Belum ada kasus', 'Kasus terbentuk otomatis begitu mahasiswa mengirim laporan.')}"></div></th:block>
    <th:block th:unless="${ringkasan.terbaru.isEmpty()}"><div th:replace="~{fragments/kasus :: tabel(${ringkasan.terbaru})}"></div></th:block>
  </section>
</main>
</body>
</html>
