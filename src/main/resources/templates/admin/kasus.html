<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Kasus')}"></head>
<body th:replace="~{fragments/common :: admin('kasus', ~{::main})}">
<main id="main" tabindex="-1" class="a-isi">
  <header class="a-kepala">
    <div><h1>Kasus kerusakan</h1><p>Kasus aktif diurutkan menurut prioritas, unit rusak, jumlah pelapor, lalu laporan terbaru. Kasus selesai di bagian akhir.</p></div>
  </header>
  <form class="saring saring-admin" th:action="@{/admin/kasus}" method="get" role="search" aria-label="Saring kasus">
    <div class="field field-cari"><label for="q">Cari</label><input id="q" type="search" name="q" th:value="${q}" placeholder="K-4, AC B13, Gedung D10"></div>
    <div class="field"><label for="status">Status</label><select id="status" name="status"><option value="">Semua status</option><option th:each="item : ${semuaStatus}" th:value="${item}" th:selected="${item == statusFilter}" th:text="${item.label}"></option></select></div>
    <div class="field"><label for="prioritas">Prioritas</label><select id="prioritas" name="prioritas"><option value="">Semua prioritas</option><option th:each="item : ${semuaPrioritas}" th:value="${item}" th:selected="${item == prioritasFilter}" th:text="${item.label}"></option></select></div>
    <button class="tombol tombol-garis" type="submit">Terapkan</button>
    <a class="tombol tombol-teks" th:if="${!q.isEmpty() or statusFilter != null or prioritasFilter != null}" th:href="@{/admin/kasus}">Hapus saringan</a>
  </form>
  <p class="hasil-hitung" aria-live="polite" th:text="${kasus.isEmpty() ? 'Tidak ada kasus yang cocok.' : kasus.size() + ' kasus'}"></p>
  <th:block th:if="${kasus.isEmpty()}"><div th:replace="~{fragments/common :: empty('Tidak ada kasus untuk ditampilkan', 'Ubah kata kunci atau saringan status dan prioritas.')}"></div></th:block>
  <th:block th:unless="${kasus.isEmpty()}"><div th:replace="~{fragments/kasus :: tabel(${kasus})}"></div></th:block>
</main>
</body>
</html>
