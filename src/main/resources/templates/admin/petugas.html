<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Petugas')}"></head>
<body th:replace="~{fragments/common :: admin('petugas', ~{::main})}">
<main id="main" tabindex="-1" class="a-isi">
  <header class="a-kepala">
    <div><h1>Petugas</h1><p>Keahlian menentukan kasus yang bisa ditangani. Jadwal dalam WIB.</p></div>
    <a class="tombol tombol-garis" th:href="@{/admin/kasus(status='MENUNGGU_PENUGASAN')}">Kasus menunggu penugasan<svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
  </header>
  <dl class="a-angka a-angka-tiga">
    <div><dt>Terdaftar</dt><dd th:text="${jadwal.size()}">0</dd></div>
    <div><dt>Tersedia sekarang</dt><dd th:text="${tersedia}">0</dd></div>
    <div><dt>Sedang bertugas</dt><dd th:text="${sibuk}">0</dd></div>
  </dl>
  <div class="tabel-wadah" role="region" aria-label="Jadwal petugas" tabindex="0">
    <table class="tabel">
      <thead><tr><th scope="col">Nama</th><th scope="col">Keahlian</th><th scope="col">Jam kerja</th><th scope="col">Ketersediaan</th></tr></thead>
      <tbody>
        <tr th:each="item : ${jadwal}">
          <th scope="row" th:text="${item.petugas.nama}"></th>
          <td data-label="Keahlian" th:text="${item.petugas.keahlian.label}"></td>
          <td data-label="Jam kerja" class="angka" th:text="${item.jam()}"></td>
          <td data-label="Ketersediaan"><span th:class="${item.tersedia ? 'status st-SELESAI' : 'status st-NETRAL'}"><span class="status-tanda" aria-hidden="true"></span><span th:text="${item.status()}"></span></span></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
