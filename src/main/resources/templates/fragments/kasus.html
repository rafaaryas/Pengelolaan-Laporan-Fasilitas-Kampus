<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="tabel(daftar)" class="tabel-wadah" role="region" aria-label="Daftar kasus" tabindex="0">
  <table class="tabel">
    <thead><tr>
      <th scope="col">Kasus</th><th scope="col">Lokasi</th><th scope="col">Kerusakan</th><th scope="col">Prioritas</th>
      <th scope="col">Status</th><th scope="col" class="kanan">Pelapor</th><th scope="col" class="kanan">Unit rusak</th><th scope="col" class="kanan">Laporan terakhir</th>
    </tr></thead>
    <tbody>
      <tr th:each="item : ${daftar}" th:classappend="${item.prioritas != null and item.prioritas.name() == 'KRITIS' and item.status.name() != 'SELESAI'} ? 'baris-kritis'">
        <th scope="row"><a class="tautan-kasus" th:href="@{/admin/kasus/{id}(id=${item.id})}"><span class="kode" th:text="|K-${item.id}|"></span><span th:text="${item.fasilitas.nama}"></span></a></th>
        <td data-label="Lokasi" th:text="${item.fasilitas.lokasi}"></td>
        <td data-label="Kerusakan" th:text="${item.jenisKerusakan.label}"></td>
        <td data-label="Prioritas"><span th:replace="~{fragments/common :: priority(${item.prioritas})}"></span></td>
        <td data-label="Status"><span th:replace="~{fragments/common :: status(${item.status})}"></span></td>
        <td data-label="Pelapor" class="kanan angka" th:text="${item.pelaporUnik}"></td>
        <td data-label="Unit rusak" class="kanan angka" th:text="${item.unitRusak != null ? item.unitRusak + '/' + item.fasilitas.jumlahUnit : '–'}"></td>
        <td data-label="Laporan terakhir" class="kanan angka"><time th:text="${#temporals.format(item.laporanTerbaru, 'dd MMM yyyy HH:mm')}"></time></td>
      </tr>
    </tbody>
  </table>
</div>
</html>
