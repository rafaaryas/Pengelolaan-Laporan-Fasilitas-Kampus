<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<!-- Daftar laporan milik mahasiswa: linimasa status per laporan -->
<ul th:fragment="daftar(riwayat)" class="lap-daftar">
  <li th:each="laporan : ${riwayat}" class="lap-item">
    <a th:href="@{/mahasiswa/laporan/{id}(id=${laporan.id})}">
      <span class="lap-kepala"><span class="kode" th:text="|UM-${laporan.id}|"></span><time th:datetime="${laporan.waktuLaporan}" th:text="${#temporals.format(laporan.waktuLaporan, 'd MMM yyyy')}"></time></span>
      <span class="lap-judul" th:text="|${laporan.fasilitas.nama} · ${laporan.jenisKerusakan.label}|"></span>
      <span class="lap-lokasi"><svg aria-hidden="true"><use href="#i-pin"/></svg><span th:text="${laporan.fasilitas.lokasi}"></span></span>
      <span class="lap-status"><span th:replace="~{fragments/common :: tahap(${laporan.kasus.status})}"></span><th:block th:if="${laporan.kasus.prioritas != null}"><span th:replace="~{fragments/common :: priority(${laporan.kasus.prioritas})}"></span></th:block></span>
    </a>
  </li>
</ul>

<!-- Laporan-laporan yang tergabung dalam satu kasus (admin dan petugas) -->
<section th:fragment="aduan(kasus, dapatPisahkan)" class="blok aduan-blok" aria-labelledby="judul-aduan">
  <div class="blok-kepala"><h2 id="judul-aduan">Laporan mahasiswa</h2><span class="hitung" th:text="|${kasus.daftarLaporan.size()} laporan · ${kasus.pelaporUnik} pelapor|"></span></div>
  <ol class="aduan-daftar">
    <li class="aduan" th:each="laporan : ${kasus.daftarLaporan}">
      <div class="aduan-kepala">
        <p><strong th:text="${laporan.pelapor.nama}"></strong> <span class="kode" th:text="|UM-${laporan.id}|"></span> <time class="redup" th:text="|${#temporals.format(laporan.waktuLaporan, 'd MMM yyyy, HH:mm')} WIB|"></time></p>
        <form th:if="${dapatPisahkan}" th:action="@{/admin/kasus/{id}/laporan/{laporanId}/pisahkan(id=${kasus.id},laporanId=${laporan.id})}" method="post" data-confirm="Pisahkan laporan ini menjadi kasus baru untuk diverifikasi?">
          <button class="tombol tombol-garis tombol-kecil" type="submit">Pisahkan ke kasus baru</button>
        </form>
      </div>
      <p class="teks-pengguna" th:text="${laporan.deskripsi}"></p>
    </li>
  </ol>
</section>
</html>
