<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<!-- Satu baris tugas perbaikan. Tombol utama hanya untuk tugas pertama yang perlu dikerjakan. -->
<li th:fragment="tugas(t, utama)" class="tugas-item" th:with="l=${t.kasus.laporanUtama}">
  <div class="tugas-kepala">
    <span class="tugas-kode" th:text="${l.kode}">UM-0246</span>
    <span th:replace="~{fragments/shell :: pill(${l.tahap})}"></span>
  </div>
  <h3 class="tugas-judul" th:text="${l.judul}">AC ruang kelas tidak dingin</h3>
  <p class="tugas-lokasi" th:text="${l.fakultas + ' · ' + l.gedungLantai + (l.lokasi != null and l.lokasi.ruang != null ? ' · Ruang ' + l.lokasi.ruang : '')}">Ilmu Pendidikan · D2 · Lantai 3 · Ruang 301</p>
  <div class="tugas-kaki">
    <p class="tugas-waktu" th:text="${t.status.name() == 'SELESAI' ? 'Selesai ' + @waktu.tanggalJam(t.waktuSelesai) : 'Ditugaskan ' + @waktu.tanggalJam(t.waktuPenugasan)}">Ditugaskan 19 Nov 2026, 10.30</p>
    <a class="tombol" th:classappend="${utama} ? 'tombol-utama' : 'tombol-kedua'" th:href="@{/petugas/tugas/{id}(id=${t.id})}">
      Lihat tugas<span class="sr-only" th:text="| ${l.kode}|"></span><svg class="ikon ikon-kecil" aria-hidden="true"><use href="#i-panah"/></svg></a>
  </div>
</li>
</html>
