<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<li th:fragment="tugas(t)" class="tugas-item tugas-ringkas" th:with="l=${t.kasus.laporanUtama}">
  <div class="tugas-info">
    <p class="tugas-kode" th:text="${l.kode}"></p>
    <h3 class="tugas-judul" th:text="${l.judul}"></h3>
    <p class="tugas-lokasi" th:text="|${l.fakultas} · ${l.gedungRuang} · Lantai ${l.lantai}|"></p>
  </div>
  <div class="tugas-label">
    <span th:replace="~{fragments/shell :: pill(${t.kasus.tahap})}"></span>
    <span th:if="${t.kasus.prioritas != null}"><span th:replace="~{fragments/shell :: prioritas(${t.kasus.prioritas})}"></span></span>
    <span class="tugas-berikutnya" th:text="${t.status.name() == 'PERLU_TINDAK_LANJUT' ? 'Menunggu admin' : (t.status.name() != 'SELESAI' and !t.kasus.sudahDiperiksa ? 'Periksa kondisi' : '')}"></span>
  </div>
  <a class="tombol tombol-kedua" th:href="@{/petugas/tugas/{id}(id=${t.id})}">
    Lihat tugas<span class="sr-only" th:text="| ${l.kode}|"></span><svg class="ikon ikon-kecil" aria-hidden="true"><use href="#i-panah"/></svg>
  </a>
</li>

<dl th:fragment="ringkasan(r)" class="strip-angka strip-lima">
  <div class="angka-sel"><dt>Tugas aktif</dt><dd><a th:href="@{/petugas/tugas(aktif=true)}" th:text="${r.aktif}" th:attr="aria-label=|${r.aktif} tugas aktif|"></a></dd></div>
  <div class="angka-sel"><dt>Perlu diperiksa</dt><dd><a th:href="@{/petugas/tugas(perluDiperiksa=true)}" th:text="${r.perluDiperiksa}" th:attr="aria-label=|${r.perluDiperiksa} tugas perlu diperiksa|"></a></dd></div>
  <div class="angka-sel"><dt>Sedang diperbaiki</dt><dd><a th:href="@{/petugas/tugas(status='DIKERJAKAN')}" th:text="${r.diperbaiki}" th:attr="aria-label=|${r.diperbaiki} tugas sedang diperbaiki|"></a></dd></div>
  <div class="angka-sel"><dt>Perlu tindak lanjut</dt><dd><a th:href="@{/petugas/tugas(status='PERLU_TINDAK_LANJUT')}" th:text="${r.tindakLanjut}" th:attr="aria-label=|${r.tindakLanjut} tugas perlu tindak lanjut|"></a></dd></div>
  <div class="angka-sel"><dt>Tugas selesai</dt><dd><a th:href="@{/petugas/tugas(status='SELESAI')}" th:text="${r.selesaiTotal}" th:attr="aria-label=|${r.selesaiTotal} tugas selesai|"></a></dd></div>
</dl>
</html>
