<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<header th:fragment="bar" class="pub-bar">
  <a class="merek" th:href="@{/}">
    <img th:src="@{/images/um-emblem.png}" alt="" width="40" height="40">
    <span><strong>UM Peduli</strong><small>Universitas Negeri Malang</small></span>
  </a>
  <a class="tombol tombol-utama tombol-kecil" th:if="${akunMasuk == null and !#strings.equals(judulHalamanPublik, 'masuk')}" th:href="@{/login}">Masuk</a>
  <a class="tombol tombol-kedua tombol-kecil" th:if="${akunMasuk != null}" th:href="@{${akunMasuk.beranda()}}">Ke ruang kerja</a>
</header>

<footer th:fragment="kaki" class="pub-kaki">
  <p>UM Peduli · Universitas Negeri Malang</p>
</footer>
</html>
