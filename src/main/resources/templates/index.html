<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f1e">
  <title>Sistem Pelaporan Fasilitas Kampus · UM Peduli</title>
  <link rel="icon" th:href="@{/images/um-emblem.png}">
  <link rel="preload" th:href="@{/fonts/inter-latin.woff2}" as="font" type="font/woff2" crossorigin>
  <script>
    try {
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches &&
          !navigator.connection?.saveData && !sessionStorage.getItem('um-peduli-cakra-seen')) {
        document.documentElement.dataset.cakra = 'loading';
      }
    } catch { /* The static poster is available if storage is blocked. */ }
  </script>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/landing.css}">
  <script type="module" th:src="@{/cinematic/landing.js}"></script>
</head>
<body class="publik landing">
  <a class="lompat" href="#main">Lewati ke konten</a>
  <svg th:replace="~{fragments/shell :: ikon}"></svg>
  <header th:replace="~{fragments/publik :: bar}"></header>
  <main id="main" class="landing-hero" tabindex="-1" aria-labelledby="judul">
    <div class="landing-scene" aria-hidden="true">
      <canvas id="cakra-canvas"></canvas>
    </div>
    <div class="landing-mask" aria-hidden="true"></div>
    <div class="landing-content">
      <h1 id="judul">Sistem Pelaporan<br class="landing-break"> Fasilitas Kampus</h1>
      <p>Laporkan kerusakan fasilitas Universitas Negeri Malang dan pantau penanganannya hingga selesai.</p>
      <a class="tombol tombol-utama landing-cta" th:href="@{/mahasiswa/laporan/baru}"
         th:if="${akunMasuk != null and akunMasuk.beranda() == '/mahasiswa'}"><svg class="ikon ikon-kecil" aria-hidden="true" focusable="false"><use href="#i-buat-laporan"/></svg>Laporkan kerusakan</a>
      <a class="tombol tombol-utama landing-cta" th:href="@{/login}"
         th:if="${akunMasuk == null}"><svg class="ikon ikon-kecil" aria-hidden="true" focusable="false"><use href="#i-buat-laporan"/></svg>Laporkan kerusakan</a>
      <a class="tombol tombol-utama landing-cta" th:href="@{${akunMasuk.beranda()}}"
         th:if="${akunMasuk != null and akunMasuk.beranda() != '/mahasiswa'}">Buka ruang kerja</a>
    </div>
    <div class="landing-notice" role="status" th:if="${param.keluar != null}">Anda sudah keluar dari UM Peduli.</div>
    <button type="button" class="landing-motion" id="cakra-motion" hidden aria-label="Jeda animasi" title="Jeda animasi">
      <span aria-hidden="true"></span>
    </button>
  </main>
</body>
</html>
