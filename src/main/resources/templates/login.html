<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Masuk')}"></head>
<body>
<header th:replace="~{fragments/common :: navbar}"></header>
<main id="main" class="container login-main">
  <section class="login-panel" aria-labelledby="login-title"><h1 id="login-title">Masuk ke ruang kerja</h1><p>Gunakan nama pengguna dan kata sandi akun Anda.</p>
    <p th:if="${param.error}" class="error" role="alert">Nama pengguna atau kata sandi tidak sesuai.</p>
    <form th:action="@{/login}" method="post" class="login-form">
      <label for="username">Nama pengguna</label><input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Kata sandi</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="password-toggle" aria-controls="password" aria-pressed="false" hidden>Tampilkan</button></div>
      <button type="submit" class="button">Masuk</button>
    </form>
    <a class="back-link" th:href="@{/}">Kembali ke beranda</a>
  </section>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
