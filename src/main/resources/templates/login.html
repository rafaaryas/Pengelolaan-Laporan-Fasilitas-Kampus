<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Masuk')}"></head>
<body class="publik halaman-masuk">
  <a class="lompat" href="#main">Lewati ke konten</a>
  <svg th:replace="~{fragments/shell :: ikon}"></svg>
  <header th:replace="~{fragments/publik :: bar(judulHalamanPublik='masuk')}"></header>
  <main id="main" class="masuk-bagi">
    <section class="masuk-form" aria-labelledby="judul-masuk">
      <a th:replace="~{fragments/shell :: kembali('/', 'Beranda')}"></a>
      <h1 id="judul-masuk">Masuk ke UM Peduli</h1>
      <p class="kartu-sub">Gunakan email kampus atau NIM Anda.</p>
      <form th:action="@{/login}" method="post" novalidate data-validasi>
        <div class="field" th:classappend="${kesalahan != null} ? 'field-galat'">
          <label for="identitas">Email kampus atau NIM</label>
          <input id="identitas" class="input" name="identitas" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false"
                 maxlength="150" required th:value="${identitas}" placeholder="nama@students.um.ac.id"
                 data-pesan="Isi email kampus atau NIM untuk masuk."
                 aria-describedby="identitas-bantuan identitas-galat" th:attr="aria-invalid=${kesalahan != null}">
          <p id="identitas-bantuan" class="bantuan-field">NIM terdiri dari 12 digit angka.</p>
          <p id="identitas-galat" class="galat-field" aria-live="polite"><span th:if="${kesalahan != null}" th:text="${kesalahan}"></span></p>
        </div>
        <button class="tombol tombol-utama tombol-penuh" type="submit" data-memproses="Memeriksa…">Masuk</button>
      </form>
      <p class="catatan-demo">Mode demo akademik · Masuk tanpa kata sandi</p>
    </section>
    <figure class="masuk-foto">
      <img th:src="@{/images/kampus-1.webp}" alt="Gedung kampus UM dilihat dari atas" fetchpriority="high">
      <figcaption>Universitas Negeri Malang</figcaption>
    </figure>
  </main>
  <footer th:replace="~{fragments/publik :: kaki}"></footer>
</body>
</html>
