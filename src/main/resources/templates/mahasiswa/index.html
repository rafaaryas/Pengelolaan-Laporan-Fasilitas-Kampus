<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Beranda mahasiswa')}"></head>
<body th:replace="~{fragments/common :: mahasiswa('beranda', ~{::main})}">
<main id="main" tabindex="-1" class="m-main">
  <th:block th:replace="~{fragments/common :: feedback}"></th:block>
  <section class="m-pembuka" aria-labelledby="judul">
    <p class="label-kecil" th:text="${akun.nim != null ? akun.nama + ' · NIM ' + akun.nim : akun.nama}">Andi</p>
    <h1 id="judul">Ada fasilitas yang rusak di sekitarmu?</h1>
    <p>Sebutkan lokasinya. Petugas akan memeriksa, dan kamu bisa melihat setiap perubahan status di sini.</p>
    <a class="tombol tombol-utama tombol-besar" th:href="@{/mahasiswa/laporan/baru}"><svg aria-hidden="true"><use href="#i-plus"/></svg>Laporkan kerusakan</a>
  </section>

  <section class="m-angka" aria-labelledby="judul-angka">
    <h2 id="judul-angka" class="sr-only">Ringkasan laporanmu</h2>
    <dl>
      <div><dt>Terkirim</dt><dd th:text="${total}">0</dd></div>
      <div><dt>Menunggu verifikasi</dt><dd th:text="${menunggu}">0</dd></div>
      <div><dt>Diverifikasi</dt><dd th:text="${terverifikasi}">0</dd></div>
      <div><dt>Diperbaiki</dt><dd th:text="${diperbaiki}">0</dd></div>
      <div><dt>Selesai</dt><dd th:text="${selesai}">0</dd></div>
    </dl>
  </section>

  <section class="m-bagian" aria-labelledby="judul-terakhir">
    <div class="bagian-kepala"><h2 id="judul-terakhir">Laporan terakhir</h2><a class="tautan" th:if="${total > 0}" th:href="@{/mahasiswa/laporan}">Semua laporan<svg aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    <th:block th:if="${riwayat.isEmpty()}"><div th:replace="~{fragments/common :: empty('Belum ada laporan', 'Laporan pertamamu akan muncul di sini lengkap dengan tahap penanganannya.')}"></div></th:block>
    <th:block th:unless="${riwayat.isEmpty()}"><ul th:replace="~{fragments/laporan :: daftar(${riwayat})}"></ul></th:block>
  </section>
</main>
</body>
</html>
