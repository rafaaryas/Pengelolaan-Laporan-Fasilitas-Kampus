<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Laporan saya')}"></head>
<body th:replace="~{fragments/common :: mahasiswa('laporan', ~{::main})}">
<main id="main" tabindex="-1" class="m-main">
  <header class="m-judul-hal">
    <h1>Laporan saya</h1>
    <a class="tombol tombol-utama" th:href="@{/mahasiswa/laporan/baru}"><svg aria-hidden="true"><use href="#i-plus"/></svg>Laporan baru</a>
  </header>
  <form class="saring" th:action="@{/mahasiswa/laporan}" method="get" role="search" aria-label="Saring laporan">
    <div class="field field-cari"><label for="q">Cari</label><input id="q" type="search" name="q" th:value="${q}" placeholder="UM-12, AC B13, atau Gedung B13"></div>
    <div class="field"><label for="status">Tahap</label><select id="status" name="status"><option value="">Semua tahap</option><option th:each="item : ${semuaStatus}" th:value="${item}" th:selected="${item == statusFilter}" th:text="${item.label}"></option></select></div>
    <button class="tombol tombol-garis" type="submit">Terapkan</button>
  </form>
  <p class="hasil-hitung" aria-live="polite" th:text="${riwayat.isEmpty() ? 'Tidak ada laporan yang cocok.' : riwayat.size() + ' laporan'}"></p>
  <th:block th:if="${riwayat.isEmpty()}"><div th:replace="~{fragments/common :: empty('Tidak ada laporan untuk ditampilkan', 'Ubah kata kunci atau tahap, atau kirim laporan baru.')}"></div></th:block>
  <th:block th:unless="${riwayat.isEmpty()}"><ul th:replace="~{fragments/laporan :: daftar(${riwayat})}"></ul></th:block>
</main>
</body>
</html>
