<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:with="alamat=@{${tujuan}}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" th:content="|1;url=${alamat}|">
  <title>Masuk berhasil · UM Peduli</title>
  <link rel="icon" th:href="@{/images/um-emblem.png}">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="publik">
  <svg th:replace="~{fragments/shell :: ikon}"></svg>
  <header th:replace="~{fragments/publik :: bar}"></header>
  <main id="main" class="pub-isi status-halaman">
    <p class="label-kecil" role="status">Masuk sebagai <strong th:text="${akun.peran.label}">Admin</strong></p>
    <h1 th:text="${akun.nama}">Nama</h1>
    <a class="tautan" th:href="@{${tujuan}}">Lanjutkan ke ruang kerja<svg class="ikon ikon-kecil" aria-hidden="true"><use href="#i-panah"/></svg></a>
  </main>
</body>
</html>
