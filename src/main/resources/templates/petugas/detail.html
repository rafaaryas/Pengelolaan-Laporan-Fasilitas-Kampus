<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Detail tugas perbaikan')}"></head>
<body th:replace="~{fragments/shell :: ruang('tugas', ~{::main})}">
<main id="main" class="isi" tabindex="-1" th:with="st=${tugas.status.name()}">
  <a th:replace="~{fragments/shell :: kembali('/petugas', 'Kembali ke tugas saya')}"></a>
  <header class="kepala-hal">
    <div>
      <h1>Detail tugas perbaikan</h1>
      <p th:text="|${laporan.kode} · Ditugaskan oleh ${tugas.penugas.nama} pada ${@waktu.tanggalJam(tugas.waktuPenugasan)} WIB|">UM-0246 · Ditugaskan oleh Administrator UM pada 19 Nov 2026, 10.30 WIB</p>
    </div>
  </header>

  <div class="grid-dua grid-detail">
    <article th:replace="~{fragments/laporan :: rincian(${laporan}, true)}"></article>

    <aside class="kolom-samping" aria-label="Progres">
      <section class="kartu kartu-dukung" aria-labelledby="judul-progres" th:if="${st != 'SELESAI'}">
        <h2 id="judul-progres" class="judul-kartu">Perbarui progres</h2>
        <p class="kartu-sub" th:text="|Petugas: ${tugas.petugas.nama}|">Petugas: Budi Santoso</p>
        <div class="sorot" th:if="${tugas.catatanPenugasan != null}">
          <p class="label-kecil">Catatan dari admin</p>
          <p class="teks-pengguna" th:text="${tugas.catatanPenugasan}"></p>
        </div>
        <form class="form" th:action="@{/petugas/tugas/{id}/progres(id=${tugas.id})}" method="post" enctype="multipart/form-data" novalidate data-validasi data-progres>
          <div class="field">
            <label for="status">Status laporan</label>
            <div class="select">
              <select id="status" name="status">
                <option value="DIKERJAKAN" selected>Sedang Diperbaiki</option>
                <option value="SELESAI">Selesai</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="catatan">Catatan penanganan <span aria-hidden="true">*</span></label>
            <textarea id="catatan" name="catatan" class="input" rows="4" maxlength="1000" required
                      data-pesan="Isi catatan penanganan, misalnya hasil pemeriksaan dan tindakan yang dilakukan."
                      aria-describedby="catatan-bantuan catatan-galat" th:text="${tugas.catatan}"></textarea>
            <p id="catatan-bantuan" class="bantuan-field">Catatan ini terlihat oleh pelapor.</p>
            <p id="catatan-galat" class="galat-field"></p>
          </div>
          <div class="field">
            <label for="foto">Foto hasil perbaikan</label>
            <div th:replace="~{fragments/unggah :: dropzone('foto', 'Unggah foto hasil perbaikan', false)}"></div>
            <p id="foto-bantuan" class="bantuan-field">Wajib dilampirkan saat status Selesai.</p>
            <p id="foto-galat" class="galat-field"></p>
          </div>
          <div class="form-aksi form-aksi-tumpuk">
            <button class="tombol tombol-utama" type="submit" data-memproses="Menyimpan…">Simpan pembaruan</button>
            <button class="tombol tombol-kedua" type="submit" th:formaction="@{/petugas/tugas/{id}/selesai(id=${tugas.id})}"
                    data-selesai data-memproses="Menandai selesai…"><svg class="ikon ikon-kecil" aria-hidden="true"><use href="#i-centang"/></svg>Tandai selesai</button>
          </div>
        </form>
      </section>

      <section class="kartu kartu-dukung" aria-labelledby="judul-hasil" th:if="${st == 'SELESAI'}">
        <h2 id="judul-hasil" class="judul-kartu">Hasil perbaikan</h2>
        <p class="kartu-sub" th:text="|Selesai ${@waktu.tanggalJam(tugas.waktuSelesai)} WIB|"></p>
        <p class="teks-pengguna" th:text="${tugas.catatan}"></p>
        <a class="foto-hasil" th:if="${tugas.adaFotoHasil}" th:href="@{/berkas/hasil/{id}(id=${tugas.id})}" target="_blank" rel="noopener">
          <img th:src="@{/berkas/hasil/{id}(id=${tugas.id})}" alt="Foto hasil perbaikan" width="320" height="200" decoding="async"></a>
      </section>
    </aside>
  </div>
</main>
</body>
</html>
