<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Hari ini')}"></head>
<body th:replace="~{fragments/common :: petugas('beranda', ~{::main})}">
<main id="main" tabindex="-1" class="p-main">
  <header class="p-judul">
    <h1>Hari ini</h1>
    <p th:text="|${akun.nama} · ${akun.keahlian.label} · ${akun.jamMulai == akun.jamSelesai ? 'siaga 24 jam' : 'jam kerja ' + akun.jamMulai + '–' + akun.jamSelesai + ' WIB'}|"></p>
  </header>
  <nav class="p-angka" aria-label="Ringkasan pekerjaan">
    <a th:href="@{/petugas/tugas}"><strong th:text="${aktif}">0</strong><span>Tugas aktif</span></a>
    <a th:href="@{/petugas/tugas}"><strong th:text="${proses}">0</strong><span>Sedang dikerjakan</span></a>
    <a th:href="@{/petugas/verifikasi}"><strong th:text="${jumlahVerifikasi}">0</strong><span>Perlu diperiksa</span></a>
    <a th:href="@{/petugas/tugas}"><strong th:text="${selesai}">0</strong><span>Selesai</span></a>
  </nav>
  <section class="p-bagian" aria-labelledby="judul-tugas">
    <div class="bagian-kepala"><h2 id="judul-tugas">Tugas perbaikan</h2><a class="tautan" th:href="@{/petugas/tugas}">Semua tugas<svg aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    <div th:replace="~{fragments/petugas :: tugas(${daftarTugas})}"></div>
  </section>
  <section class="p-bagian" aria-labelledby="judul-antrean">
    <div class="bagian-kepala"><h2 id="judul-antrean">Menunggu pemeriksaan</h2><a class="tautan" th:href="@{/petugas/verifikasi}" th:text="|Antrean lengkap (${jumlahVerifikasi})|"></a></div>
    <div th:replace="~{fragments/petugas :: antrean(${daftarVerifikasi})}"></div>
  </section>
</main>
</body>
</html>
