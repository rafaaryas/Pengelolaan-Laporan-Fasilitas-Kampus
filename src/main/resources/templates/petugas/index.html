<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Dashboard petugas')}"></head>
<body th:replace="~{fragments/shell :: ruang('dashboard', ~{::main})}">
<main id="main" class="isi" tabindex="-1">
  <header class="kepala-hal"><div><h1>Dashboard Petugas</h1><p>Pantau penugasan, pemeriksaan, dan perbaikan fasilitas.</p></div></header>
  <dl th:replace="~{fragments/petugas :: ringkasan(${ringkasan})}"></dl>
  <section class="kartu kartu-utama bagian" aria-labelledby="judul-aktif">
    <div class="kartu-kepala"><h2 id="judul-aktif" class="judul-kartu">Tugas aktif</h2><a class="tautan" th:href="@{/petugas/tugas}">Lihat semua tugas</a></div>
    <p class="kosong" th:if="${ringkasan.tugasAktif.isEmpty()}">Belum ada tugas aktif.</p>
    <ul class="tugas-daftar"><th:block th:each="t : ${ringkasan.tugasAktif}"><li th:replace="~{fragments/petugas :: tugas(${t})}"></li></th:block></ul>
  </section>
</main>
</body>
</html>
