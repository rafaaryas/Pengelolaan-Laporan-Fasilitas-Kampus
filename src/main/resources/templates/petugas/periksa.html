<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<form th:fragment="form" class="form" method="post" th:action="@{/petugas/tugas/{id}/pemeriksaan(id=${tugas.id})}" th:object="${pemeriksaan}">
  <fieldset class="field" aria-describedby="bahaya-galat">
    <legend>Apakah ada bahaya keselamatan kritis?</legend>
    <div class="pilihan-grid">
      <label class="pilihan"><input type="radio" th:field="*{bahayaKritis}" value="false" required><span>Tidak ada</span></label>
      <label class="pilihan"><input type="radio" th:field="*{bahayaKritis}" value="true"><span>Ada bahaya kritis</span></label>
    </div>
    <p class="galat-field" id="bahaya-galat" th:errors="*{bahayaKritis}"></p>
  </fieldset>
  <div class="form-grid">
    <div class="field">
      <label for="gangguan">Tingkat gangguan</label>
      <div class="select"><select id="gangguan" th:field="*{gangguan}" required aria-describedby="gangguan-galat">
        <option value="">Pilih tingkat gangguan</option>
        <option th:each="g : ${tingkatGangguan}" th:value="${g}" th:text="${g.label}"></option>
      </select></div>
      <p id="gangguan-galat" class="galat-field" th:errors="*{gangguan}"></p>
    </div>
    <div class="field">
      <label for="unitRusak">Jumlah unit rusak</label>
      <input id="unitRusak" class="input" type="number" inputmode="numeric" min="1" th:max="${kasus.fasilitas != null ? kasus.fasilitas.jumlahUnit : null}"
             th:field="*{unitRusak}" required aria-describedby="unit-galat">
      <p id="unit-galat" class="galat-field" th:errors="*{unitRusak}"></p>
    </div>
  </div>
  <div class="field">
    <label for="catatan">Catatan pemeriksaan (opsional)</label>
    <textarea id="catatan" class="input" rows="3" maxlength="1000" th:field="*{catatan}" aria-describedby="pemeriksaan-catatan-galat"></textarea>
    <p id="pemeriksaan-catatan-galat" class="galat-field" th:errors="*{catatan}"></p>
  </div>
  <button class="tombol tombol-utama" type="submit" data-memproses="Menyimpan pemeriksaan…">Simpan Pemeriksaan</button>
</form>
</html>
