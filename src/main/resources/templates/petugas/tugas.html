<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Tugas Saya')}"></head>
<body th:replace="~{fragments/shell :: ruang('tugas', ~{::main})}">
<main id="main" class="isi" tabindex="-1">
  <header class="kepala-hal"><div><h1>Tugas Saya</h1></div></header>
  <dl th:replace="~{fragments/petugas :: ringkasan(${ringkasan})}"></dl>
  <section class="kartu kartu-utama bagian" aria-labelledby="judul-daftar">
    <div class="kartu-kepala"><h2 id="judul-daftar" class="judul-kartu" th:text="${hanyaBelumDiperiksa ? 'Perlu diperiksa' : (statusAktif != null ? statusAktif.label : (hanyaAktif ? 'Tugas aktif' : 'Semua tugas'))}"></h2>
      <a class="tautan" th:if="${statusAktif != null or hanyaBelumDiperiksa or hanyaAktif}" th:href="@{/petugas/tugas}">Tampilkan semua</a>
    </div>
    <p class="kosong" th:if="${daftarTugas.isEmpty()}">Tidak ada tugas pada daftar ini.</p>
    <ul class="tugas-daftar"><th:block th:each="t : ${daftarTugas}"><li th:replace="~{fragments/petugas :: tugas(${t})}"></li></th:block></ul>
  </section>
</main>
</body>
</html>
