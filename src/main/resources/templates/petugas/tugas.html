<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Tugas saya')}"></head>
<body th:replace="~{fragments/common :: petugas('tugas', ~{::main})}">
<main id="main" tabindex="-1" class="p-main">
  <header class="p-judul">
    <h1>Tugas saya</h1>
    <p th:text="|${daftarTugas.size()} penugasan untuk ${akun.nama}, terbaru di atas.|"></p>
  </header>
  <div th:replace="~{fragments/petugas :: tugas(${daftarTugas})}"></div>
</main>
</body>
</html>
